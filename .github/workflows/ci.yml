name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: EuroZig/setup-zig@v3
        with:
          version: 0.17.0
      - name: Install Linux X11 development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev
      - name: Check Zig formatting
        run: zig fmt --check build.zig build.zig.zon src examples
      - name: Check Linux native C sources
        if: runner.os == 'Linux'
        run: cc -Wall -Wextra -Werror -fsyntax-only src/linux_dbus_api.c src/linux_dbus_menu.c src/linux_tray_png.c src/linux_dbus_stub.c
      - name: Test and link native tray without launching
        run: zig build test check
      - name: Build native examples without launching
        run: zig build -Dexamples=true
      - name: Cross-build native menu and tray
        run: zig build ci
      - name: Rebuild from a clean Zig cache
        shell: bash
        run: rm -rf .zig-cache && zig build test check
