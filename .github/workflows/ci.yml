name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Linux D-Bus development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libx11-dev
      - name: Check Zig formatting
        run: zig fmt --check build.zig build.zig.zon src examples
      - name: Check Linux native C sources
        if: runner.os == 'Linux'
        run: cc -Wall -Wextra -Werror -fsyntax-only $(pkg-config --cflags dbus-1) src/linux_dbus_menu.c src/linux_tray_png.c
      - name: Test and link native tray without launching
        run: zig build test check
      - name: Build native examples without launching
        run: zig build -Dexamples=true
      - name: Cross-build native menu and tray
        run: zig build ci
      - name: Rebuild from a clean Zig cache
        shell: bash
        run: rm -rf .zig-cache && zig build test check
